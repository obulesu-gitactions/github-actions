name: Inputs
on:
  workflow_dispatch: #Trigger Manually
    inputs:
      loglevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
          - info
          - warning
          - debug
      print_tags:
        description: 'True to print STDOUT'
        required: true
        type: boolean
      tags:
        description: 'Test Scenario tag learnig'
        required: true
        type: string
      environment:
        description: 'environment to run tests against - Implementation Platform'
        required: true
        type: environment
jobs:
  print-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Print the input tag STDOUT
        run: echo The tags are ${{ inputs.tags }}
      - name: Print the environment
        run: echo The tags are ${{ inputs.environment }}
