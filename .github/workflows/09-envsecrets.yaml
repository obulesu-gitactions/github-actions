name: Greetings on variable day
on:
  workflow_dispatch
env:
  DAY_OFF_WEEK: Sunday
jobs:
  greeting_job:
    runs-on: ubuntu-latest
    env:
      Greeting: Hello
    steps:
      - name: "Say Hello to Mona, it's Monday"
        run: echo "$Greeting $First_Name. Today is $DAY_OFF_WEEK!"
        env:
          FIRST_NAME: Mona


