name: First Workflow
on: workflow_dispatch
jobs:
  first_job:
    runs-on: ubuntu-latest
    steps:
      - name: Print Greetings
        run: echo "Hello World"
      - name: Print Good Bye
        run: echo "Done - Bye!"
      - name: Print Greetings & Good Bye
        run: |
            echo "Hello World"
            echo "Welcome to Github Actions learning"
            echo "This is first sample multiline example"
            echo "Happy Learning! Bye!"
      
